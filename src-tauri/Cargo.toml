[package]
name = "noveltea"
version = "0.1.0"
description = "NovelTea — a writing app that keeps your work on your own machine"
authors = ["NovelTea"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "noveltea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
