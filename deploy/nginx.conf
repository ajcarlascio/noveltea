# Serves the built client, and proxies the API through the same origin.
#
# Same-origin is the point. NovelTea's CORS allow-list is empty by default, and an empty
# allow-list means no other origin can drive this client — which only works if the client
# and the API answer on the same one. Split them across two hostnames and the API has to
# be told about this one.
server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # The bundle is mostly JS and a WASM build of SQLite.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css text/plain application/javascript application/json
                      image/svg+xml application/wasm;

    # 8 MB is the API's own max-document-bytes. A push carrying a long chapter has to fit
    # through here too, and nginx's 1 MB default would reject it as a 413 that looks, from
    # the client, exactly like the server rejecting the writing.
    client_max_body_size 12m;

    # The client sets its own Content-Security-Policy in a <meta> element at build time.
    # frame-ancestors is deliberately not in it: browsers ignore that directive when the
    # policy arrives in a meta element and log a warning saying so. It has to come from a
    # response header, which is here. Both policies apply, and a request must satisfy both.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options         "DENY"                   always;
    add_header X-Content-Type-Options  "nosniff"                always;
    add_header Referrer-Policy         "no-referrer"            always;

    # No Cross-Origin-Embedder-Policy, deliberately. The replica uses sqlite-wasm's SAH
    # Pool VFS precisely so it does not need SharedArrayBuffer — see src/db/open.ts —
    # and require-corp would buy nothing while breaking anything cross-origin later.

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # The API's rate limiter reads the first entry of X-Forwarded-For. Without this
        # every caller arrives as this container's address and the whole world shares one
        # bucket, so one person guessing a password throttles everybody.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A first sync on a long manuscript is a big response, and a compile can sit for a
        # while before the artifact is ready.
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location /health     { proxy_pass http://api:8080/health; }
    location = /health/ready { proxy_pass http://api:8080/health/ready; }

    # Vite fingerprints these, so the file at a given name never changes. `expires` rather
    # than add_header on purpose: an add_header in a nested location replaces every header
    # inherited from the server block, which would quietly drop the four above.
    location ~* \.(?:js|css|woff2?|wasm|png|jpg|svg|ico)$ {
        expires 1y;
        access_log off;
    }

    # Not fingerprinted, and the thing that names every fingerprinted file.
    location = /index.html {
        expires -1;
    }

    # /projects/:id, /admin, /account/password are client routes; the server has never
    # heard of them and a reload on one must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
