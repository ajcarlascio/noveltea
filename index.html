<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the notch and home indicator;
         the layout then pays that back with env(safe-area-inset-*) padding. Without
         it iOS letterboxes the app with black bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The colour the OS paints around the page: browser address bar on Android,
         status bar backdrop in a standalone install. One per theme, or a dark reader
         gets a white bar above a near-black app. -->
    <meta name="theme-color" content="#e6e0d1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1b1d" media="(prefers-color-scheme: dark)" />
    <title>NovelTea</title>
    <script>
      // Applied before first paint so a reader who chose dark never sees a white flash.
      // Deliberately duplicates a few lines of the theme provider: the provider cannot
      // run early enough to prevent the flash, and a stylesheet cannot read storage.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("noveltea.theme");
          if (theme === "light" || theme === "dark") {
            root.setAttribute("data-theme", theme);
          }
          // Kept in step with FONT_CHOICES in app/typography/fonts.ts by
          // `the pre-paint script offers every font` in its test file. A face missing
          // here still works — it just arrives one paint late, as a reflow.
          var fonts = ["eb-garamond", "lora", "atkinson", "georgia", "system-serif", "system-sans"];
          var font = localStorage.getItem("noveltea.font");
          if (fonts.indexOf(font) !== -1) {
            root.setAttribute("data-font", font);
          }
          // Size matters more than colour here: getting it wrong reflows the whole
          // manuscript after first paint rather than just recolouring it.
          var sizes = ["small", "large", "x-large"];
          var size = localStorage.getItem("noveltea.fontSize");
          if (sizes.indexOf(size) !== -1) {
            root.setAttribute("data-font-size", size);
          }
        } catch (_) {
          /* storage unavailable — fall through to the defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
