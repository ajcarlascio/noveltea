# iOS and Android, on request only.
#
# Deliberately not on pull requests, and the reason is not cost. Tauri's mobile support
# has never been initialised in this repository: `src-tauri/gen/` holds nothing but
# schemas, and `gen/android` and `gen/apple` are gitignored. So these jobs run
# `tauri <platform> init` first and build what it generates.
#
# That makes them a **spike**, not a gate. Until one of them has passed at least once,
# nothing here should be read as evidence that the app builds for a phone — and the
# audit's open question 3 (whether Tauri v2 mobile can carry this app's SQLite and OPFS
# use at all, or whether it needs a native client) is still open. Run it, read what
# breaks, and decide from that rather than from a blog post.
name: Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to try
        required: true
        default: android
        type: choice
        options: [android, ios, ios-device]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    # A hung emulator would otherwise run to the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default is `tools platform-tools`; `tools` no longer exists in the
          # SDK repository, so sdkmanager exits 1. Everything needed is installed below.
          packages: ""

      - name: NDK
        # Tauri builds Rust for Android through the NDK; without it the toolchain
        # targets below have nothing to link against.
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      # Generates gen/android, which is not in the repository. Idempotent enough to run
      # every time; there is nothing checked in for it to conflict with.
      - name: Initialise
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run tauri android init -- --ci

      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run tauri android build -- --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: noveltea-android
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

      # What the build alone cannot say: does the app start in an Android WebView, and which
      # storage backend does it report? Runs an x86_64 emulator (the debug APK is universal,
      # so it contains x86_64) — hardware acceleration needs KVM, which GitHub's runners
      # have but do not grant to the runner user until this rule is applied.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The step fails only if the APK cannot be installed or started. "Storage is in
      # memory" is an answer, not a failure; it lands in the job summary instead.
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tooling/android-probe.sh "$(find src-tauri/gen/android/app/build/outputs -name "*universal*.apk" | sort | head -1)"

      - name: Verdict
        if: always()
        run: |
          if [ -s probe/state.json ]; then
            v=$(node -e 'const s=require("./probe/state.json");const d=s.dataset;console.log(`started: yes; data-db-status=${d.dbStatus}; data-db-storage=${d.dbStorage}; tauri=${s.hasTauri}; opfs=${s.hasOpfs}`)')
          else
            v="started: no ($(cat probe/verdict.txt 2>/dev/null || echo 'no state read'))"
          fi
          echo "Android: $v" | tee -a "$GITHUB_STEP_SUMMARY"
          found() { [ -s "probe/$1" ] && node -p "require('./probe/$1').found === true ? 'yes' : 'no'" || echo "not read"; }
          echo "Android: project written: $(found written.json); still there after the app was stopped and started: $(found restarted.json)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noveltea-android-probe
          path: probe/
          if-no-files-found: warn

  ios:
    name: iOS
    if: inputs.platform == 'ios'
    # Xcode only exists on a macOS runner, and an iOS build cannot happen anywhere else.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - run: npm ci

      - name: Initialise
        run: npm run tauri ios init -- --ci

      # Simulator only. A device build needs a signing identity and a provisioning
      # profile from a paid Apple Developer account, and neither belongs in a workflow
      # that exists to find out whether the thing compiles.
      - name: Build
        run: npm run tauri ios build -- --debug --target aarch64-sim

      - uses: actions/upload-artifact@v4
        with:
          name: noveltea-ios-simulator
          path: src-tauri/gen/apple/build/arm64-sim/NovelTea.app
          if-no-files-found: warn

  # An unsigned .ipa for a real device. It cannot be installed as it is: iOS runs nothing
  # unsigned. It is what a sideloading tool (Sideloadly, AltStore) signs with the owner's
  # own Apple ID on the way to the phone, which needs no paid developer account and no
  # secret in this repository.
  ios-device:
    name: iOS device (unsigned)
    if: inputs.platform == 'ios-device'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-device

      - run: npm ci

      - name: Initialise
        run: npm run tauri ios init -- --ci

      # Signing is switched off in the generated project itself, in every build
      # configuration, and again through the override file Xcode reads from the
      # environment (which alone was not enough: the target still asked for a team). The
      # archive then succeeds and the export after it cannot, there being nothing to sign
      # an export with, so the CLI's exit status is not the result: the archive is, and
      # the next step fails without one.
      - name: Build, unsigned
        run: |
          pbx=$(ls src-tauri/gen/apple/*.xcodeproj/project.pbxproj)
          sed -i '' 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/' "$pbx"
          grep -c "CODE_SIGNING_ALLOWED = NO" "$pbx"
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nCODE_SIGN_ENTITLEMENTS =\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig" npm run tauri ios build -- --target aarch64 \
            || echo "::notice::tauri ios build exited non-zero; expected at the export step without a signing identity"

      - name: Package
        run: |
          app=$(find src-tauri/gen/apple -path "*.xcarchive/Products/Applications/*.app" -maxdepth 8 -type d | head -1)
          if [ -z "$app" ]; then
            echo "::error::no archived .app was produced"
            find src-tauri/gen/apple/build -maxdepth 4 2>/dev/null | head -50
            exit 1
          fi
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../NovelTea-unsigned.ipa Payload)
          ls -lh NovelTea-unsigned.ipa
          echo "iOS device: unsigned .ipa built from $app" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: noveltea-ios-unsigned-ipa
          path: NovelTea-unsigned.ipa
          if-no-files-found: error
